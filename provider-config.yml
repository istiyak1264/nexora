settings:
  timeout_seconds: 20
  concurrency: 8
  requests_per_second: 4
  max_candidates: 100000
  user_agent: "Nexora/0.4 authorized-security-research"
providers:
  crtsh:
    enabled: true
    api_key: ""
    requests_per_second: 1
  certspotter:
    enabled: true
    api_key: "${CERTSPOTTER_API_KEY}"
    requests_per_second: 1
  hackertarget:
    enabled: true
    api_key: "${HACKERTARGET_API_KEY}"
    requests_per_second: 1
  alienvault:
    enabled: true
    api_key: "${OTX_API_KEY}"
    requests_per_second: 1
  urlscan:
    enabled: true
    api_key: "${URLSCAN_API_KEY}"
    requests_per_second: 1
  virustotal:
    enabled: true
    api_key: "${VIRUSTOTAL_API_KEY}"
    requests_per_second: 1
  securitytrails:
    enabled: false
    api_key: "${SECURITYTRAILS_API_KEY}"
    requests_per_second: 1
  shodan:
    enabled: false
    api_key: "${SHODAN_API_KEY}"
    requests_per_second: 1
  chaos:
    enabled: false
    api_key: "${CHAOS_API_KEY}"
    requests_per_second: 1
  wayback:
    enabled: true
    api_key: ""
    requests_per_second: 0.5
  github:
    enabled: false
    api_key: "${GITHUB_TOKEN}"
    requests_per_second: 1
  commoncrawl:
    enabled: false
    api_key: ""
    requests_per_second: 0.2
  anubisdb:
    enabled: false
    api_key: ""
    requests_per_second: 0.2
  bufferover:
    enabled: false
    api_key: "${BUFFEROVER_API_KEY}"
    requests_per_second: 0.03
